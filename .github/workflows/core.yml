name: Core checks

on:
  push:
  pull_request:

jobs:
  core:
    name: Core / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - if: runner.os == 'Windows'
        run: npm run build:windows-pin
      # Fail early on actual NTFS native-handle and in-place reparse-point
      # regressions; the complete suite still runs after this focused gate.
      - if: runner.os == 'Windows'
        run: node packages/studio/test/component-updates.test.mjs
      - run: npm test
      - run: npm run check
      - run: node examples/core-session.mjs
