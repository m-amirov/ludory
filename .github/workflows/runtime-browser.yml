name: Runtime browser R6
on:
  pull_request:
    paths:
      - 'packages/core/**'
      - 'packages/runtime/**'
      - 'packages/runtime-phaser/**'
      - 'packages/runtime-narrative/**'
      - 'packages/narrative/**'
      - 'packages/connect-yandex/**'
      - 'packages/studio/catalog/**'
      - 'packages/studio/src/**'
      - 'scripts/build-runtime-template.mjs'
      - 'scripts/build-narrative-template.mjs'
      - '.github/workflows/runtime-browser.yml'
      - 'package*.json'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:runtime-template
      - run: npm run check:narrative-template
      - name: Assert generated browser bundle is committed unchanged
        run: git diff --exit-code -- packages/studio/catalog/templates/runtime-basic/assets/ludory-runtime.js
      - run: npm ci --ignore-scripts
        working-directory: packages/runtime/test/browser
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: packages/runtime/test/browser
      - run: npm run smoke
        working-directory: packages/runtime/test/browser
      - run: npm ci --ignore-scripts
        working-directory: packages/runtime-phaser/test/browser
      - run: npm run smoke
        working-directory: packages/runtime-phaser/test/browser
      - run: npm ci --ignore-scripts
        working-directory: packages/runtime-narrative/test/browser
      - run: npm run smoke
        working-directory: packages/runtime-narrative/test/browser
        env:
          LUDORY_N2_ARTIFACT_DIR: artifacts
      - name: Upload N2 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narrative-n2-browser
          path: packages/runtime-narrative/test/browser/artifacts/
          if-no-files-found: ignore
      - run: npm run smoke:n3
        working-directory: packages/runtime-narrative/test/browser
        env:
          LUDORY_N3_ARTIFACT_DIR: artifacts/n3
      - name: Upload N3 Studio browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narrative-n3-studio-browser
          path: packages/runtime-narrative/test/browser/artifacts/n3/
          if-no-files-found: ignore
