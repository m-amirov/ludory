<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ludory VK Runtime</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; min-width: 0; background: #101a2b; color: #f2f5fc; }
    main { width: min(100%, 1060px); margin: auto; padding: clamp(12px, 2.5vw, 26px); }
    h1 { margin: 0 0 12px; font-size: clamp(1.5rem, 3vw, 2rem); }
    #game { display: grid; place-items: center; width: 100%; height: clamp(230px, 54dvh, 510px);
      min-width: 0; border: 2px solid #4f91c3; border-radius: 16px; background: #203d5b;
      touch-action: none; user-select: none; font-weight: 700; font-size: clamp(1.1rem, 3vw, 1.6rem); }
    #game:focus-visible { outline: 3px solid #a1ecff; outline-offset: 4px; }
    .hud { display: flex; align-items: center; justify-content: space-between; gap: 10px;
      flex-wrap: wrap; margin: 10px 0; }
    .hud p { margin: 0; }
    #controls { display: flex; flex-wrap: wrap; gap: 8px; }
    button { min-height: 44px; max-width: 100%; padding: 8px 15px; border: 1px solid #76b6eb;
      border-radius: 10px; color: #f2f5fc; background: #294765; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #a1ecff; outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #status { font-weight: 700; overflow-wrap: anywhere; }
    #error { min-height: 1.5em; color: #ffb4b4; overflow-wrap: anywhere; }
    @media (max-width: 600px) {
      #game { height: clamp(230px, 40dvh, 380px); }
      #controls button { flex: 1 1 132px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Ludory VK Runtime</h1>
    <div id="game" tabindex="0" role="button" aria-label="Tap to score">Tap or press Enter to score</div>
    <div class="hud">
      <p>Score: <output id="score">0</output></p>
      <p id="status" role="status">CONNECTING</p>
    </div>
    <div id="controls">
      <button id="start" disabled>Start</button>
      <button id="pause" disabled>Pause</button>
      <button id="resume" disabled>Resume</button>
      <button id="save" disabled>Save to VK</button>
      <button id="restore" disabled>Restore from VK</button>
      <button id="sound" disabled>Sound</button>
      <button id="fullscreen-ad" disabled>Fullscreen ad</button>
      <button id="rewarded-ad" disabled>Rewarded ad</button>
    </div>
    <p id="reward-notice" role="status" aria-live="polite">Rewarded ad: not confirmed</p>
    <p id="error" role="alert"></p>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
